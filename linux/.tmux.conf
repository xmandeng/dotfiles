##### TMUX CONFIGURATION FILE #####
 
# --- Quick Setup Instructions for Future Reference ---
 
# 1. Install prerequisites (on WSL/Ubuntu):
#     sudo apt update
#     sudo apt install tmux git
#
# 2. Clone TPM (Tmux Plugin Manager):
#     mkdir -p ~/.tmux/plugins
#     git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#
# 3. (Optional) For best visuals, install and configure a Nerd Font in your terminal emulator.
#
# 4. Start tmux:
#     tmux
#
# 5. Install plugins (inside tmux, press prefix + I):
#     - By default, prefix is Ctrl+A in this config. So: Press 'Ctrl+A' then 'I'
#
# 6. If using bash, make sure to set your default shell in this file:
#     set -g default-shell /bin/bash
#     set -g default-command "bash -l"
#
# 7. (Optional) For true color and theme support, add this to your ~/.bashrc:
#     export TERM=tmux-256color
#
# --- End Setup Instructions ---
 
##### General Settings #####
 
set-option -g status-position top
# set -g default-terminal "screen-256color"
set -g default-terminal "tmux-256color"
 
bind -n C-p command-prompt -p "previous command:" "send-keys -R \; send-keys Up"
bind -n C-n command-prompt -p "next command:" "send-keys -R \; send-keys Down"
 
# Word navigation bindings (for consistency)
bind-key -n C-Left send-keys M-b
bind-key -n C-Right send-keys M-f
 
# Line navigation bindings
bind-key -n M-Left send-keys C-a
bind-key -n M-Right send-keys C-e
 
set -g default-shell /bin/bash
set -g default-command "bash -l"
set -sg escape-time 50
set -g prefix ^A
set -g base-index 1
set -g pane-base-index 1
 
##### Splitting Panes #####
 
unbind %
bind | split-window -h -c "#{pane_current_path}"
 
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
 
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded .tmux.conf"
 
set -g detach-on-destroy off
 
##### Catppuccin Theme #####
 
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_status_style "rounded"
 
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator ""
set -g @catppuccin_window_middle_separator " "
 
set -g @catppuccin_window_default_fill "none"
set -g @catppuccin_window_current_fill "all"
 
set -g @catppuccin_window_status_enable "off"
set -g @catppuccin_window_status_current_enable "off"
 
##### Status Bar #####
 
# ⛔ Remove far-left session indicator
set -g status-left-length 0
set -g status-left ""
 
# ✅ Right side preserved
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
 
set -g status-style "bg=#1e1e2e"
set -g pane-border-status off
set -g pane-border-format ""
 
##### Mouse & Plugins #####
 
set -g mouse on
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tpm'
 
run '~/.tmux/plugins/tpm/tpm'
 
# ✅ Keep window index and name in window list
# Inactive windows
set -g window-status-format "#[fg=#000000,bg=#b4befe] #I #[fg=#ffffff,bg=#1c1c1c] #W "
 
# Active window
set -g window-status-current-format "#[fg=#000000,bg=#fab387] #I #[fg=#ffffff,bg=#1c1c1c] #W "
