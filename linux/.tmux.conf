##### TMUX CONFIGURATION FILE #####

# --- Setup Instructions ---
#
# 1. Install prerequisites:
#     sudo apt update && sudo apt install tmux git
#
# 2. Clone TPM (Tmux Plugin Manager):
#     git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#
# 3. Start tmux and install plugins:
#     tmux
#     Press Ctrl+A then I (capital) to install plugins
#
# 4. Reload config:
#     Press Ctrl+A then r
#
# --- Key Bindings ---
#
#   Ctrl+A         Prefix key (replaces default Ctrl+B)
#   Prefix + |     Vertical split
#   Prefix + -     Horizontal split
#   Prefix + r     Reload config
#   Prefix + I     Install new plugins (TPM)
#   Prefix + Tab   Toggle file sidebar
#   Prefix + Ctrl+s   Save session (resurrect)
#   Prefix + Ctrl+r   Restore session (resurrect)
#   Ctrl+P / Ctrl+N   Previous / next command
#   Ctrl+Left/Right   Jump word
#   Alt+Left/Right    Jump to start/end of line
#
# --- End Instructions ---

# Set prefix key to Ctrl+a (replaces default Ctrl+b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Command history navigation
bind -n C-p command-prompt -p "previous command:" "send-keys -R \; send-keys Up"
bind -n C-n command-prompt -p "next command:" "send-keys -R \; send-keys Down"

# Word navigation bindings
bind-key -n C-Left send-keys M-b
bind-key -n C-Right send-keys M-f

# Line navigation bindings
bind-key -n M-Left send-keys C-a
bind-key -n M-Right send-keys C-e

# Shell settings
set -g default-shell /bin/bash
set -g default-command "bash -l"
set -sg escape-time 50
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Status line at the top
set-option -g status-position top

set -g status 2
set -g status-format[1] ''

# Create Panes: window splitting
## Split vertically
unbind %
bind | split-window -h -c "#{pane_current_path}" # Prefix | to create vertical split

## Split horizontally
unbind '"'
bind - split-window -v -c "#{pane_current_path}" # Prefix - to create horizontal split

set -g mouse on
set -g default-terminal "tmux-256color"

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"

# Load catppuccin
run ~/.tmux/plugins/tmux/catppuccin.tmux

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# Reload config easily
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Plugins
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Initialize TPM (Tmux Plugin Manager)
run '~/.tmux/plugins/tpm/tpm'
