[env]
TERM = "tmux-256color"

[[keyboard.bindings]]
key = "Left"
mods = "Control"
chars = "\u0001\u0001"  # Double Ctrl+A to bypass the prefix issue

[[keyboard.bindings]]
key = "Right"
mods = "Control"
chars = "\u0005"  # Ctrl+E → end of line

[[keyboard.bindings]]
key = "Up"
mods = "Control"
chars = "\u001b[1;5A"

[[keyboard.bindings]]
key = "Down"
mods = "Control"
chars = "\u001b[1;5B"

[[keyboard.bindings]]
key = "Left"
mods = "Command"
chars = "\u001bb"

[[keyboard.bindings]]
key = "Right"
mods = "Command"
chars = "\u001bf"

[window]
padding.x = 10
padding.y = 10

decorations = "Buttonless"

opacity = 0.9
blur = true

[font]
normal.family = "FiraCode Nerd Font Mono"
size = 14.0

[mouse]
bindings = [
    { mouse = "Right", action = "Paste" }
]
